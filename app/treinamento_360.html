<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento 360° | O Pai</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="guard_acesso.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f172a; /* Grafite tático */
            color: #f1f5f9;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-360 {
            width: 100%;
            background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
            padding: 15px 20px;
            box-sizing: border-box;
            border-bottom: 2px solid #ca8a04;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-360 h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #ca8a04;
            text-transform: uppercase;
        }
        
        .header-360 .stats {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .arena {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-left: 4px solid #4FA5FF;
        }

        .question-meta {
            font-size: 0.8rem;
            color: #94A3B8;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            border-color: #4FA5FF;
            background: #1e293b;
        }

        .option-btn.selected {
            border-color: #ca8a04;
            background: rgba(202, 138, 4, 0.1);
        }

        .option-btn.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .option-btn.wrong {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        /* Área do Professor / Correção Meticulosa */
        .feedback-box {
            display: none;
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #ca8a04;
            animation: slideIn 0.3s ease-out forwards;
        }
        
        .feedback-box.error {
            border-left-color: #ef4444;
        }
        .feedback-box.success {
            border-left-color: #10b981;
        }

        .feedback-title {
            font-weight: 900;
            margin-bottom: 10px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap; /* Mantém as quebras de linha do banco */
        }

        .dica-box {
            background: rgba(202, 138, 4, 0.1);
            border: 1px dashed #ca8a04;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
            color: #fde047;
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-next {
            background: linear-gradient(135deg, #4FA5FF 0%, #2563EB 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            display: none;
        }
        
        .btn-next:hover { opacity: 0.9; }

        .btn-audio {
            background: transparent;
            border: 1px solid #4FA5FF;
            color: #4FA5FF;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #loading {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }

    </style>
    <script src="/api/config"></script>
</head>
<body>

    <header class="header-360">
        <h1>O Pai 360°</h1>
        <div class="stats" id="ui-progress">Buscando banco...</div>
    </header>

    <div class="arena">
        <div id="loading">Carregando a matriz tática...<br><small>Sincronizando com o Supabase</small></div>
        
        <div id="question-container" style="display: none;">
            <div class="question-card">
                <div class="question-meta">
                    <span id="q-materia">Matéria</span>
                    <button class="btn-audio" onclick="window.lerIntegra()">🔊 Ouvir Questão e Opções</button>
                </div>
                <div class="question-text" id="q-texto">
                    ...
                </div>
                <!-- Suporte a Imagens para Bancas Pesadas (Pedro II / Exatas) -->
                <img id="q-image" src="" alt="Imagem da Questão" style="display: none; width: 100%; max-width: 600px; border-radius: 8px; margin: 0 auto 25px auto; border: 2px solid #334155;">
                
                <div class="options-list" id="q-opcoes">
                    <!-- Opções injetadas via JS -->
                </div>
            </div>

            <div class="feedback-box" id="feedback-panel">
                <div class="feedback-title" id="f-title">⚠️ Correção Meticulosa</div>
                <div class="feedback-content" id="f-texto">...</div>
                <div class="dica-box" id="f-dica" style="display:none;"></div>
            </div>

            <div class="controls">
                <button class="btn-next" id="btn-next" onclick="proximaQuestao()">AVANÇAR <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Referência ao FontAwesome e Lógica Principal -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="treinamento_360.js?v=8"></script>
</body>
</html>
